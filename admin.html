<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Desa Sepadu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f0e6;
            color: #333;
        }

        /* NAVBAR */
        nav {
            background: #6b8e23;
            color: white;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .home {
            text-decoration: none;
            color: white;
            background: #8b6f47;
            padding: 9px 18px;
            border-radius: 20px;
        }

        /* LOGIN */
        #loginPage {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 380px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .login-box h1 {
            color: #6b8e23;
            margin-bottom: 10px;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #6b8e23;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #526d1b;
        }

        #pesan {
            margin-top: 15px;
            font-weight: bold;
        }

        /* DASHBOARD */
        #dashboard {
            display: none;
            padding: 40px 7%;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            color: #6b8e23;
        }

        .logout {
            border: none;
            background: #8b6f47;
            color: white;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* CARD */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            flex: 1;
            min-width: 200px;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #6b8e23;
            margin-top: 10px;
        }

        /* TABLE */
        .table-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow-x: auto;
        }

        .table-box h2 {
            color: #6b8e23;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: #6b8e23;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .status {
            padding: 6px 10px;
            border-radius: 20px;
            background: #dce8bd;
            color: #526d1b;
            font-size: 13px;
        }

        .ubah-status {
            margin-top: 7px;
            padding: 6px;
            border-radius: 7px;
            border: 1px solid #ccc;
        }

        @media(max-width:700px) {

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .login-box {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->

<nav>

    <div class="logo">
        🌿 Desa Sepadu
    </div>

    <a href="index.html" class="home">
        ← Beranda
    </a>

</nav>


<!-- LOGIN -->

<section id="loginPage">

    <div class="login-box">

        <div class="icon">
            🔐
        </div>

        <h1>Login Admin</h1>

        <p>
            Admin Desa Sepadu
        </p>

        <input
            type="password"
            id="password"
            placeholder="Masukkan password"
        >

        <button
            class="login-btn"
            onclick="login()">

            🔑 Masuk

        </button>

        <div id="pesan"></div>

    </div>

</section>


<!-- DASHBOARD -->

<section id="dashboard">

    <div class="dashboard-header">

        <div>

            <h1>Dashboard Admin</h1>

            <p>
                Data Pengaduan Masyarakat Desa Sepadu
            </p>

        </div>

        <button
            class="logout"
            onclick="logout()">

            🚪 Keluar

        </button>

    </div>


    <!-- STATISTIK -->

    <div class="cards">

        <div class="card">

            <span>📋</span>

            <h2 id="total">
                0
            </h2>

            <p>Total Pengaduan</p>

        </div>


        <div class="card">

            <span>⏳</span>

            <h2 id="belum">
                0
            </h2>

            <p>Belum Diproses</p>

        </div>


        <div class="card">

            <span>✅</span>

            <h2 id="selesai">
                0
            </h2>

            <p>Selesai</p>

        </div>

    </div>


    <!-- DATA -->

    <div class="table-box">

        <h2>
            📢 Pengaduan Masyarakat
        </h2>

        <table>

            <thead>

                <tr>

                    <th>No</th>
                    <th>Token</th>
                    <th>Tanggal</th>
                    <th>Nama</th>
                    <th>Kontak</th>
                    <th>Kategori</th>
                    <th>Pengaduan</th>
                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="dataPengaduan">

                <tr>

                    <td colspan="8"
                        style="text-align:center">

                        Memuat data...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</section>


<script>

/* =====================================
   LINK GOOGLE APPS SCRIPT
   ===================================== */

const SPREADSHEET_ID = "AKfycbyL41wzwaoKCWK_t7Ktb_DIqDJbP8ZvL6QZ_VhjBmwNNeeU5pP25fJSP7p_lHntfqhvLw/exec";
const SHEET_NAME = "Pengaduan";
/* =====================================
   PASSWORD ADMIN
   ===================================== */

const PASSWORD_ADMIN = "suciramadani79";


/* =====================================
   LOGIN
   ===================================== */

function login() {

    const password =
        document.getElementById("password").value;

    const pesan =
        document.getElementById("pesan");


    if (password === PASSWORD_ADMIN) {

        document.getElementById(
            "loginPage"
        ).style.display = "none";


        document.getElementById(
            "dashboard"
        ).style.display = "block";


        pesan.innerHTML = "";


        ambilData();

    } else {

        pesan.innerHTML =
            "❌ Password salah!";

        pesan.style.color = "red";

    }

}


/* =====================================
   AMBIL DATA DARI APPS SCRIPT
   ===================================== */

function ambilData() {

    google.script.run

        .withSuccessHandler(function(data) {

            tampilkanData(data);

        })

        .withFailureHandler(function(error) {

            document.getElementById(
                "dataPengaduan"
            ).innerHTML = `

                <tr>

                    <td colspan="8"
                        style="text-align:center;color:red">

                        Gagal mengambil data.

                    </td>

                </tr>

            `;

            console.log(error);

        })

        .ambilPengaduan();

}


/* =====================================
   TAMPILKAN DATA
   ===================================== */

function tampilkanData(data) {

    const tbody =
        document.getElementById(
            "dataPengaduan"
        );


    tbody.innerHTML = "";


    let belum = 0;
    let selesai = 0;


    if (!data || data.length === 0) {

        tbody.innerHTML = `

            <tr>

                <td colspan="8"
                    style="text-align:center">

                    📭 Belum ada pengaduan.

                </td>

            </tr>

        `;

        document.getElementById(
            "total"
        ).innerText = 0;

        return;
    }


    data.forEach(function(item, index) {

        if (
            item.status ===
            "Belum Diproses"
        ) {
            belum++;
        }


        if (
            item.status ===
            "Selesai"
        ) {
            selesai++;
        }


        tbody.innerHTML += `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    <b>${item.token || "-"}</b>
                </td>

                <td>
                    ${item.timestamp || "-"}
                </td>

                <td>
                    ${item.nama || "-"}
                </td>

                <td>
                    ${item.kontak || "-"}
                </td>

                <td>
                    ${item.kategori || "-"}
                </td>

                <td>
                    ${item.pengaduan || "-"}
                </td>

                <td>

                    <span class="status">
                        ${item.status || "Belum Diproses"}
                    </span>

                </td>

            </tr>

        `;

    });


    document.getElementById(
        "total"
    ).innerText = data.length;


    document.getElementById(
        "belum"
    ).innerText = belum;


    document.getElementById(
        "selesai"
    ).innerText = selesai;

}


/* =====================================
   LOGOUT
   ===================================== */

function logout() {

    document.getElementById(
        "dashboard"
    ).style.display = "none";


    document.getElementById(
        "loginPage"
    ).style.display = "flex";


    document.getElementById(
        "password"
    ).value = "";

}

</script>

</body>
</html>
